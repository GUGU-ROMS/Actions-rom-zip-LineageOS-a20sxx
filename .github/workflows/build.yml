name: A20s Kernel + Boot Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DEVICE: a20s
      THREADS: 4

    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential \
        gcc-aarch64-linux-gnu \
        g++-aarch64-linux-gnu \
        git bc bison flex \
        libssl-dev libelf-dev \
        device-tree-compiler \
        python3 python3-pip \
        cpio zip unzip

    - name: Clone kernel
      run: |
        git clone --depth=1 https://github.com/GUGU-ROMS/android_kernel_samsung_a20sxx_old.git kernel

    - name: Build kernel
      run: |
        cd kernel

        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        mkdir out

        CONFIG=$(ls arch/arm64/configs | grep -i a20 | head -n1)

        make O=out ARCH=arm64 $CONFIG
        export HOSTCFLAGS="-fcommon"
        make -j4 \
        O=out \
        ARCH=arm64 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        Image.gz dtbs

    - name: Collect build files
      run: |
        mkdir output

        cp kernel/out/arch/arm64/boot/Image.gz output/

        find kernel/out -name "*.dtb" -exec cat {} + > output/dtb.img

        cp kernel/out/arch/arm64/boot/dtbo.img output/

    - name: Create ramdisk
      run: |
        mkdir ramdisk

        echo '#!/system/bin/sh' > ramdisk/init
        echo 'exit 0' >> ramdisk/init

        chmod +x ramdisk/init

        cd ramdisk
        find . | cpio -o -H newc > ../ramdisk.cpio
    - name: Install mkbootimg
      run: |
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg
        sudo cp mkbootimg/mkbootimg.py /usr/local/bin/mkbootimg
        sudo chmod +x /usr/local/bin/mkbootimg
    - name: Build boot.img
      run: |
        mkbootimg \
        --kernel output/Image.gz \
        --ramdisk ramdisk.cpio \
        --dtb output/dtb.img \
        --pagesize 2048 \
        --base 0x00000000 \
        --output output/boot.img

    - name: Create flashable ZIP
      run: |
        mkdir -p flash/META-INF/com/google/android

        cp output/boot.img flash/
        cp output/dtbo.img flash/

        cat > flash/META-INF/com/google/android/updater-script << 'EOF'
        ui_print("Flashing A20s Kernel");
        package_extract_file("boot.img", "/dev/block/by-name/boot");
        package_extract_file("dtbo.img", "/dev/block/by-name/dtbo");
        ui_print("Done");
        EOF

        cd flash
        zip -r ../A20s_kernel_flashable.zip *

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: A20s_kernel_package
        path: A20s_kernel_flashable.zip
